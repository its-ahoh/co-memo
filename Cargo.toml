[package]
name = "co-memo"
version = "0.2.0"
edition = "2021"
publish = false
description = "Local-first memory CLI and MCP server for AI agents"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "co-memo"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
notify = "8"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
